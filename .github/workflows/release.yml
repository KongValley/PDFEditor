name: 打包发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dist:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/v
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run dist -- --publish never

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes release/Win7-32位/*.exe release/Win10-64位/*.exe release/Win10-32位/*.exe release/Win7-64位/*.exe
          if ($LASTEXITCODE -ne 0) {
            # tag 已存在 Release(重复触发/重跑):改为增量上传
            gh release upload $env:GITHUB_REF_NAME release/Win7-32位/*.exe release/Win10-64位/*.exe release/Win10-32位/*.exe release/Win7-64位/*.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }