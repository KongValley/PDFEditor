name: 打包发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dist:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/v
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 20 已于 2026-04 结束维护;与本地开发环境保持一致(本机 v24 验证过
          # 构建与冒烟)。仓库无原生依赖(运行时 dependencies 为空),不存在 ABI 风险。
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run dist -- --publish never

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只取四个架构分发目录里的产物:不能递归 —— release/win-unpacked/ 是
          # 打包中间目录,里面 resources/elevate.exe 之类的内部文件不是分发物
          $assets = @(
            Get-ChildItem -Path 'release/Win7-32位','release/Win7-64位','release/Win10-32位','release/Win10-64位' -File |
              Where-Object { $_.Extension -in '.exe', '.zip' } |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) { Write-Error '未找到任何安装包/绿色版产物'; exit 1 }
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes @assets
          if ($LASTEXITCODE -ne 0) {
            # tag 已存在 Release(重复触发/重跑):改为增量上传
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }