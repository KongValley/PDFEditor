name: 测试

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/v
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm 的 allowScripts 门禁会拦掉 electron 的 postinstall(本地 npm ci 后同样需要),
      # 显式跑一次安装脚本,保证 runner 上有 dist/electron.exe
      - name: 准备 electron 二进制
        run: node node_modules/electron/install.js

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试(vitest,附覆盖率摘要)
        run: npm test

      - run: npm run build

      - name: 兼容性检查(超出 Electron 22 / Chromium 108 的新特性即失败)
        run: npm run check:compat

      # GitHub 的 windows runner 镜像没有 SimHei,样本生成与「中文批注保存」都依赖中文字体:
      # 下载一份思源黑体(OTF,pdf-lib + fontkit 可正常子集化)并通过 PDF_EDITOR_CJK_FONT 指定
      - name: 准备中文字体(runner 无 SimHei)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf' -OutFile tmp/cjk.otf
          "PDF_EDITOR_CJK_FONT=$env:GITHUB_WORKSPACE\tmp\cjk.otf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # samples/ 不入版本库,冒烟依赖它;新克隆的 runner 上必须先生成
      - name: 生成测试样本
        run: npm run samples

      # 应用默认关闭硬件加速(软件光栅),CI 无 GPU 也能跑
      - name: 端到端冒烟(31 步)
        run: npm run smoke